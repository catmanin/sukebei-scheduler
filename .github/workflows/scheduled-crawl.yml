name: Sukebei Scheduled Crawler

on:
  schedule:
    # 每天跑一轮（约 750 条/天的新 ID，一轮即可覆盖；GitHub 最短间隔 5 分钟）
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      initial_id:
        description: '初始 ID（仅首次运行/重置水位线时用，之后以 state 文件为准）'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sukebei-scheduler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      # ── 跑一轮定时爬虫 ──
      # 初始 ID 优先级: 手动触发输入 > 仓库变量 SUKEBEI_INITIAL_ID > 默认值
      # -u: 无缓冲输出，进度实时显示在 Actions 日志里
      - name: Run one scheduled round
        timeout-minutes: 60
        env:
          INITIAL_ID: ${{ inputs.initial_id || vars.SUKEBEI_INITIAL_ID || '4693264' }}
        run: |
          python3 -u sukebei_scheduler.py --once \
            --initial-id "$INITIAL_ID" \
            --output "data/sukebei_{ts}.jsonl" \
            --state state/sukebei_state.json \
            --workers 3 \
            --min-delay 0.8 \
            --max-delay 1.3

      # ── 提交结果与水位线（下轮从这里继续） ──
      - name: Commit results
        run: |
          git config user.email "bot@users.noreply.github.com"
          git config user.name "bot"
          git add -A
          git diff --staged --quiet || git commit -m "auto: scheduled crawl results"
          git push
